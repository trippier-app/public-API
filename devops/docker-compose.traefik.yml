# Traefik routes, added ONLY by `make dev`. Attaches both APIs to the shared
# trippier-edge network so the Traefik of docker-compose.edge.yml can reach them
# (the .localhost TLD resolves to 127.0.0.1 natively, no /etc/hosts edits).
#
#   http://api.poi.trippier.localhost:8100   -> poi-api
#   http://api.ai.trippier.localhost:8100    -> itinerary-api
#   http://traefik.trippier.localhost:8100   -> Traefik dashboard (also on :8101)

services:

  poi-api:
    networks:
      - default
      - edge
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.poi-api.rule=Host(`api.poi.trippier.localhost`)"
      - "traefik.http.services.poi-api.loadbalancer.server.port=8080"

  itinerary-api:
    networks:
      - default
      - edge
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.itinerary-api.rule=Host(`api.ai.trippier.localhost`)"
      - "traefik.http.services.itinerary-api.loadbalancer.server.port=8000"

networks:
  edge:
    external: true
    name: trippier-edge
